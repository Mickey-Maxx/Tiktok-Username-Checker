name: Build Cross-Platform Executables

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            asset_name: TikTokUserChecker-macOS.zip
            script: |
              chmod +x build.sh
              ./build.sh
              cd dist
              zip -r ../TikTokUserChecker-macOS.zip TikTokUserChecker

          - os: ubuntu-latest
            asset_name: TikTokUserChecker-Linux.zip
            script: |
              chmod +x build.sh
              ./build.sh
              cd dist
              zip -r ../TikTokUserChecker-Linux.zip TikTokUserChecker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Executable
        run: ${{ matrix.script }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
